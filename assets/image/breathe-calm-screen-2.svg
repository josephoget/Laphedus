  <text x="165" y="325" fill="#8F84C2" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700">AUTOMATIC THOUGHT</text>
  <text x="165" y="360" fill="#241E38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18">"Everything is falling behind schedule."</text>
  <text x="165" y="395" fill="#5F756C" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">Distortion: Catastrophizing · Mind Reading</text>

