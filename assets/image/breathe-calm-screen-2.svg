  <rect x="680" y="140" width="480" height="210" rx="30" fill="#FFFFFF" stroke="#EAE5F5" stroke-width="2"/>
  <rect x="720" y="175" width="40" height="40" rx="14" fill="#E68770"/>
  <text x="732" y="202" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20">⚡</text>
  <text x="775" y="202" fill="#241E38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700">Circle of Control Tool</text>
  <text x="720" y="248" fill="#696084" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16">Separate what you cannot control from the clear, practical actions right in front of you.</text>
