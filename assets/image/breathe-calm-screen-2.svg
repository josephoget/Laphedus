  <rect x="140" y="130" width="48" height="48" rx="16" fill="#8F84C2"/>
  <text x="154" y="162" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700">✎</text>
  <text x="204" y="162" fill="#241E38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700">Mind Journal</text>
