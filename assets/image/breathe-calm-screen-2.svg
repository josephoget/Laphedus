  <text x="165" y="475" fill="#4E8470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700">BALANCED PERSPECTIVE</text>
  <text x="165" y="510" fill="#1C2E26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18">"I can only take action on one task at a time."</text>
  <text x="165" y="545" fill="#4E8470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">Result: Stress eased from 8/10 to 3/10</text>

